name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the desktop builds
# and the web build attached.
on:
  push:
    tags:
      - "v*"

env:
  ODIN_RELEASE: dev-2026-10

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            archive: sudoku-linux.tar.gz
            binary: sudoku
          - name: macOS
            os: macos-latest
            archive: sudoku-macos.tar.gz
            binary: sudoku
          - name: Windows
            os: windows-latest
            archive: sudoku-windows.zip
            binary: sudoku.exe
            # Icon of the .exe in Explorer
            flags: -resource:sudoku.rc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - name: Install raylib dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          libglu1-mesa-dev libxcursor-dev libxinerama-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        shell: bash
        run: |
          mkdir -p build
          odin build . -vet -o:speed -out:build/${{ matrix.binary }} ${{ matrix.flags }}
      - name: Archive
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.archive }} ${{ matrix.binary }}
          else
            tar -czf ../${{ matrix.archive }} ${{ matrix.binary }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - uses: mymindstorm/setup-emsdk@v16
      - name: Build
        run: |
          ./build_web.sh
          cd build/web && zip -r ../../sudoku-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-web.zip
          path: sudoku-web.zip

  release:
    name: Publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          dist/*
